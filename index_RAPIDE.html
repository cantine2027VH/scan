<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan Cantine</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  body{font-family:sans-serif;margin:0;text-align:center;background:#111;color:#fff}
  input,button{font-size:20px;padding:12px;margin:6px;border-radius:8px;border:0}
  #status{position:fixed;top:0;left:0;right:0;padding:6px;font-size:15px;background:#14532d;z-index:50}
  #reader{width:100%;max-width:460px;margin:auto}
  #msg{margin:10px;padding:14px;border-radius:12px;font-size:20px;background:#333}
  #full{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:99;align-items:center;justify-content:center;flex-direction:column;font-size:34px;padding:20px;color:#fff;font-weight:bold}
  #full .big{font-size:120px;line-height:1.1}
  #full.ok{background:#1b8a3a}#full.dup{background:#d98a00}#full.err{background:#c62828}
  #startBtn{font-size:26px;padding:18px 28px;background:#1b8a3a;color:#fff}
</style>
</head>
<body>
<div id="status">Chargement…</div>

<div id="login" style="padding-top:70px">
  <h2>Code d'accès</h2>
  <input id="pin" type="password" placeholder="PIN"><br>
  <button onclick="login()">Entrer</button>
  <div id="lerr" style="color:#ff8a80"></div>
</div>

<div id="app" style="display:none;padding-top:34px">
  <h2>Scan Cantine</h2>
  <button id="startBtn" onclick="startScan()">▶ Démarrer le scan</button>
  <div id="reader"></div>
  <div id="msg">Appuyez sur Démarrer</div>
  <input id="manual" placeholder="Code manuel (ex: 6A001)" autocomplete="off">
  <button onclick="sendManual()">OK</button>
</div>

<div id="full" onclick="hideFull()"></div>

<script>
// ⚠️ Lien de VOTRE script (celui qui finit par /exec)
const API = 'https://script.google.com/macros/s/AKfycbwSzk_a3W4Xmku_B3qosqUxq-BzGXI599Aiq06wHrJZ7b38YrLGG1RZqn7x3MPZ88rH/exec';

function ls(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lset(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function today() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }

let PIN = ls('pin') || '';
let students = JSON.parse(ls('students') || 'null');   // { CODE: [nom, classe] } gardé dans le téléphone
let pending = JSON.parse(ls('pending') || '[]');       // scans pas encore envoyés
let done = JSON.parse(ls('done:' + today()) || '[]');  // codes déjà scannés aujourd'hui
let lastText = '', lastT = 0, fullTimer = null, audioCtx = null, scanner = null, flushing = false;

/* ---------- son ---------- */
function ctx() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
  return audioCtx;
}
function beep(f, d, w, type) {
  const c = ctx(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = f;
  const t = c.currentTime + w;
  g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + 0.02);
}
function soundOk()  { beep(880, 0.1, 0); beep(1320, 0.16, 0.11); }
function soundDup() { beep(520, 0.12, 0); beep(520, 0.12, 0.18); }
function soundErr() { beep(200, 0.4, 0, 'sawtooth'); }

/* ---------- réseau ---------- */
function post(body) {
  const ac = new AbortController();
  const to = setTimeout(() => ac.abort(), 25000);
  return fetch(API, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body), signal: ac.signal
  }).then(r => r.json()).finally(() => clearTimeout(to));
}
function denied() { try { localStorage.removeItem('pin'); } catch (e) {} location.reload(); }

function updateStatus() {
  const el = document.getElementById('status');
  if (pending.length) { el.textContent = '⏳ ' + pending.length + " en attente d'envoi"; el.style.background = '#8a5a00'; }
  else { el.textContent = '✅ Tout est enregistré'; el.style.background = '#14532d'; }
}
function savePending() { lset('pending', JSON.stringify(pending)); updateStatus(); }

function flush() {
  if (flushing || !pending.length) return;
  flushing = true;
  const batch = pending.slice();
  post({ action: 'batch', pin: PIN, items: batch }).then(r => {
    if (r.status === 'denied') { denied(); return; }
    if (r.status !== 'ok') throw new Error('serveur');
    pending = pending.filter(p => batch.indexOf(p) < 0);
    savePending(); flushing = false;
    if (pending.length) flush();
  }).catch(() => { flushing = false; updateStatus(); setTimeout(flush, 5000); });
}

function loadStudents() {
  return post({ action: 'students', pin: PIN }).then(r => {
    if (r.status === 'denied') { denied(); return; }
    if (r.students) { students = r.students; lset('students', JSON.stringify(students)); }
  });
}

/* ---------- affichage ---------- */
function showMsg(t) { document.getElementById('msg').innerHTML = t; }
function hideFull() { document.getElementById('full').style.display = 'none'; }
function showResult(icon, text, c) {
  showMsg(icon + ' ' + text.replace('<br>', ' - '));
  const f = document.getElementById('full');
  f.className = c;
  f.innerHTML = '<div class="big">' + icon + '</div><div>' + text + '</div>';
  f.style.display = 'flex';
  if (c === 'ok') soundOk(); else if (c === 'dup') soundDup(); else soundErr();
  if (navigator.vibrate) navigator.vibrate(c === 'ok' ? 80 : [80, 50, 80]);
  clearTimeout(fullTimer);
  fullTimer = setTimeout(hideFull, 800);
}

/* ---------- scan : réponse immédiate, envoi en arrière-plan ---------- */
function handle(text) {
  let code = String(text || '').trim();
  if (code.indexOf('=') > -1) code = code.split('=').pop();
  code = code.toUpperCase();
  if (!code) return;
  const s = students && students[code];
  if (students && !s) { showResult('❌', 'Code inconnu : ' + code, 'err'); return; }
  const name = s ? s[0] + ' (' + s[1] + ')' : code;
  if (done.indexOf(code) > -1) { showResult('⚠️', name + "<br>déjà enregistré aujourd'hui", 'dup'); return; }
  done.push(code); lset('done:' + today(), JSON.stringify(done));
  pending.push({ code: code, ts: Date.now() }); savePending();
  showResult('✅', name + '<br>présent', 'ok');
  flush();
}
function onScan(text) {
  const now = Date.now();
  if (text === lastText && now - lastT < 2500) return;
  lastText = text; lastT = now;
  handle(text);
}
function sendManual() {
  const m = document.getElementById('manual');
  ctx(); handle(m.value); m.value = '';
}

/* ---------- démarrage ---------- */
function showApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}
function login() {
  PIN = document.getElementById('pin').value.trim();
  post({ action: 'check', pin: PIN }).then(r => {
    if (!r.ok) { document.getElementById('lerr').textContent = 'Code incorrect'; return; }
    lset('pin', PIN);
    return loadStudents().then(() => { showApp(); updateStatus(); });
  }).catch(e => { document.getElementById('lerr').textContent = 'Réseau : ' + e.message; });
}
function startScan() {
  ctx(); // le clic débloque le son automatique
  document.getElementById('startBtn').style.display = 'none';
  scanner = new Html5Qrcode('reader', {
    formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
    experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    verbose: false
  });
  const cfg = { fps: 20, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.8); return { width: s, height: s }; } };
  scanner.start({ facingMode: 'environment' }, cfg, onScan).then(() => showMsg('Prêt à scanner…')).catch(() => {
    Html5Qrcode.getCameras().then(cams => {
      if (!cams || !cams.length) throw new Error('aucune caméra');
      const back = cams.find(c => /back|rear|environment|arrière/i.test(c.label)) || cams[cams.length - 1];
      return scanner.start(back.id, cfg, onScan);
    }).then(() => showMsg('Prêt à scanner…'))
      .catch(err => { showMsg('Caméra non disponible : ' + err); document.getElementById('startBtn').style.display = 'inline-block'; });
  });
}

updateStatus();
if (PIN) {
  showApp();
  loadStudents().catch(() => { if (!students) showMsg('Connexion requise la première fois'); });
  flush();
}
setInterval(flush, 15000);
setInterval(() => { if (PIN) loadStudents().catch(() => {}); }, 10 * 60 * 1000);
window.addEventListener('online', flush);
</script>
</body>
</html>
